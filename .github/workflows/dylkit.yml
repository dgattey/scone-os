name: dylkit

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Bump type; auto reads the Release info checkbox in the merge commit'
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  pull-requests: read

jobs:
  dylkit:
    uses: dgattey/dyl-kit/.github/workflows/app.yml@f0c1e619ed78c7a0aec245e9b94450fb5584dc2c
    with:
      release_type: ${{ inputs.release_type || 'auto' }}
    secrets: inherit
