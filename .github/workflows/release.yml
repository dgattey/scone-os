# Generated by `./run dev ci sync` from DylKit's CIWrappers. Change the template there, then re-sync.
name: release

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Packages/DylKit/Sources/**'
      - 'Packages/DylKit/Package.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - 'DylApp.toml'
      - 'Sconeos.local.entitlements'
      - 'sparkle-public-key.txt'
      - 'scripts/generate-icon.swift'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Bump type; auto reads the merged PR''s Release info checkbox'
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - name: Plan the version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: ./run release version --type "${RELEASE_TYPE:-auto}"
      - name: Bundle
        run: ./run release bundle
      - name: Sign
        run: ./run release sign
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
        run: ./run release appcast
      - name: Check
        run: ./run release check
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./run release publish
      - name: Check the live site
        run: ./run release check --live --wait 900
