name: site

on:
  pull_request:
    paths:
      - 'server/**'
      - 'Packages/DylKit/web/**'
      - 'DylApp.toml'

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            Packages/DylKit/web/package-lock.json
      - name: Test @dylkit/web
        working-directory: Packages/DylKit/web
        run: npm ci --no-audit --no-fund && npm test && npm run typecheck
      - name: Build the site
        working-directory: server
        run: npm ci --no-audit --no-fund && npm run build
