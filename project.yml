name: Sconeos
options:
  bundleIdPrefix: com.sconeos
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SconeKit:
    path: .
targets:
  Sconeos:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/SconeosApp
    dependencies:
      - package: SconeKit
        product: SconeUI
      - package: SconeKit
        product: SconeStore
      - package: SconeKit
        product: SconeDomain
      - package: SconeKit
        product: SpotifyBridge
    settings:
      base:
        PRODUCT_NAME: Sconeos
        PRODUCT_BUNDLE_IDENTIFIER: com.sconeos.Sconeos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Sconeos reads the current Spotify track and pauses Spotify after a room starts playing it.
        ENABLE_HARDENED_RUNTIME: NO
    info:
      properties:
        CFBundleDisplayName: Sconeos
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: Sconeos discovers and controls Sonos speakers on your local network.
        NSBonjourServices:
          - _sonos._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.sconeos.callback
            CFBundleURLSchemes:
              - sconeos
  Sconeos-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/SconeosApp
    dependencies:
      - package: SconeKit
        product: SconeUI
      - package: SconeKit
        product: SconeStore
      - package: SconeKit
        product: SconeDomain
      - package: SconeKit
        product: SpotifyBridge
    settings:
      base:
        PRODUCT_NAME: Sconeos
        PRODUCT_BUNDLE_IDENTIFIER: com.sconeos.Sconeos.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        SUPPORTS_MACCATALYST: NO
    info:
      properties:
        CFBundleDisplayName: Sconeos
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Sconeos discovers and controls Sonos speakers on your local network.
        NSBonjourServices:
          - _sonos._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.sconeos.callback
            CFBundleURLSchemes:
              - sconeos
