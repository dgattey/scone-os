name: SconeOS
options:
  bundleIdPrefix: com.sconeos
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SconeKit:
    path: .
targets:
  SconeOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/SconeOSApp
    dependencies:
      - package: SconeKit
        product: SconeUI
      - package: SconeKit
        product: SconeStore
      - package: SconeKit
        product: SconeDomain
      - package: SconeKit
        product: SpotifyBridge
    settings:
      base:
        PRODUCT_NAME: SconeOS
        PRODUCT_BUNDLE_IDENTIFIER: com.sconeos.SconeOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSAppleEventsUsageDescription: SconeOS reads the current Spotify track and pauses Spotify after a room starts playing it.
        ENABLE_HARDENED_RUNTIME: NO
    info:
      properties:
        CFBundleDisplayName: SconeOS
        NSHighResolutionCapable: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sconeos.callback
            CFBundleURLSchemes:
              - sconeos
  SconeOS-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/SconeOSApp
    dependencies:
      - package: SconeKit
        product: SconeUI
      - package: SconeKit
        product: SconeStore
      - package: SconeKit
        product: SconeDomain
      - package: SconeKit
        product: SpotifyBridge
    settings:
      base:
        PRODUCT_NAME: SconeOS
        PRODUCT_BUNDLE_IDENTIFIER: com.sconeos.SconeOS.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        SUPPORTS_MACCATALYST: NO
    info:
      properties:
        CFBundleDisplayName: SconeOS
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.sconeos.callback
            CFBundleURLSchemes:
              - sconeos
